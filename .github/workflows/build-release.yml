name: Build Release

# Runs automatically when you create a GitHub release (via gh release create or the web UI).
# Builds Mac (arm64 + x64 DMG) and Windows (x64 NSIS installer) in parallel,
# then uploads both to the release as downloadable assets.

on:
  release:
    types: [created]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Mac packages (arm64 + x64 DMG)
        run: npx vite build && npx electron-builder --mac --publish never

      - name: Upload Mac DMGs to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx vite build && npx electron-builder --win --publish never

      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
